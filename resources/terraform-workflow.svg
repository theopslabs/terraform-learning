<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
  <title id="title">Terraform Core Workflow</title>
  <desc id="desc">A visual guide to the Terraform workflow: write, init, plan, apply, destroy. Plan compares desired configuration, recorded state and real cloud infrastructure. Apply updates AWS and state, which feeds the next plan.</desc>

  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>

    <linearGradient id="updatedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <style>
      .title { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 400; fill: #475569; }
      .card-title { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 700; fill: #0F172A; }
      .body { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 400; fill: #475569; }
      .label { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 700; letter-spacing: 0.8px; }
      .mono { font-family: "DejaVu Sans Mono", "SFMono-Regular", Consolas, monospace; }
      .tiny { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 600; }
      .num { font-family: "Noto Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="1140" fill="#F8FAFC"/>
  <circle cx="1510" cy="90" r="210" fill="#EDE9FE" opacity="0.45"/>
  <circle cx="110" cy="1080" r="180" fill="#DBEAFE" opacity="0.35"/>

  <!-- header -->
  <g>
    <rect x="50" y="34" width="56" height="56" rx="14" fill="url(#logoGrad)" filter="url(#softShadow)"/>
    <path d="M66 50 L90 50 L90 58 L80 58 L80 76 L72 76 L72 58 L66 58 Z" fill="#FFFFFF"/>
    <text x="124" y="66" class="title" font-size="38">Terraform Core Workflow</text>
    <text x="124" y="94" class="subtitle" font-size="17">From desired state to real infrastructure — write · init · plan · apply · destroy</text>
    <rect x="1280" y="46" width="270" height="38" rx="19" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <circle cx="1301" cy="65" r="5" fill="#7C3AED"/>
    <text x="1316" y="71" class="label" font-size="12.5" fill="#6D28D9">VISUAL GUIDE · LESSON 5</text>
  </g>

  <!-- workflow row -->
  <g filter="url(#shadow)">
    <!-- 1 write -->
    <g>
      <rect x="50" y="145" width="270" height="160" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
      <circle cx="82" cy="177" r="16" fill="#7C3AED"/>
      <text x="82" y="182" text-anchor="middle" class="num" font-size="14">1</text>
      <g transform="translate(268,159)" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16M6 16l10-10 4 4-10 10H6v-4z"/>
      </g>
      <text x="72" y="227" class="card-title" font-size="23">Write</text>
      <text x="72" y="252" class="mono" font-size="13" fill="#6D28D9">main.tf · variables.tf</text>
      <text x="72" y="279" class="body" font-size="13.5">Describe the infrastructure</text>
      <text x="72" y="298" class="body" font-size="13.5">you want in HCL.</text>
    </g>

    <!-- 2 init -->
    <g>
      <rect x="350" y="145" width="270" height="160" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <circle cx="382" cy="177" r="16" fill="#2563EB"/>
      <text x="382" y="182" text-anchor="middle" class="num" font-size="14">2</text>
      <g transform="translate(568,159)" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>
      </g>
      <text x="372" y="227" class="card-title" font-size="23">Init</text>
      <text x="372" y="252" class="mono" font-size="13" fill="#1D4ED8">terraform init</text>
      <text x="372" y="279" class="body" font-size="13.5">Install providers &amp; modules,</text>
      <text x="372" y="298" class="body" font-size="13.5">configure backend, write lock.</text>
    </g>

    <!-- 3 plan -->
    <g>
      <rect x="650" y="145" width="270" height="160" rx="18" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
      <circle cx="682" cy="177" r="16" fill="#D97706"/>
      <text x="682" y="182" text-anchor="middle" class="num" font-size="14">3</text>
      <g transform="translate(868,159)" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </g>
      <text x="672" y="227" class="card-title" font-size="23">Plan</text>
      <text x="672" y="252" class="mono" font-size="13" fill="#B45309">terraform plan</text>
      <text x="672" y="279" class="body" font-size="13.5">Preview changes against state</text>
      <text x="672" y="298" class="body" font-size="13.5">and the real cloud. Read-only.</text>
    </g>

    <!-- 4 apply -->
    <g>
      <rect x="950" y="145" width="270" height="160" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <circle cx="982" cy="177" r="16" fill="#059669"/>
      <text x="982" y="182" text-anchor="middle" class="num" font-size="14">4</text>
      <g transform="translate(1168,159)" fill="#059669" stroke="none">
        <path d="M8 5l11 7-11 7V5z"/>
      </g>
      <text x="972" y="227" class="card-title" font-size="23">Apply</text>
      <text x="972" y="252" class="mono" font-size="13" fill="#047857">terraform apply</text>
      <text x="972" y="279" class="body" font-size="13.5">Create, update or delete via</text>
      <text x="972" y="298" class="body" font-size="13.5">provider APIs; update state.</text>
    </g>

    <!-- 5 destroy -->
    <g>
      <rect x="1250" y="145" width="270" height="160" rx="18" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <circle cx="1282" cy="177" r="16" fill="#DC2626"/>
      <text x="1282" y="182" text-anchor="middle" class="num" font-size="14">5</text>
      <g transform="translate(1468,159)" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/>
      </g>
      <text x="1272" y="227" class="card-title" font-size="23">Destroy</text>
      <text x="1272" y="252" class="mono" font-size="13" fill="#B91C1C">terraform destroy</text>
      <text x="1272" y="279" class="body" font-size="13.5">Remove managed resources</text>
      <text x="1272" y="298" class="body" font-size="13.5">and clean up state.</text>
    </g>
  </g>

  <!-- workflow arrows -->
  <g stroke="#94A3B8" stroke-width="2.5" fill="none">
    <line x1="324" y1="225" x2="344" y2="225" marker-end="url(#arrow)"/>
    <line x1="624" y1="225" x2="644" y2="225" marker-end="url(#arrow)"/>
    <line x1="924" y1="225" x2="944" y2="225" marker-end="url(#arrow)"/>
    <line x1="1224" y1="225" x2="1244" y2="225" marker-end="url(#arrow)"/>
  </g>

  <!-- under the hood panel -->
  <g>
    <rect x="50" y="345" width="1500" height="755" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="82" y="392" class="title" font-size="26">Under the hood</text>
    <text x="82" y="420" class="subtitle" font-size="16">Plan compares three sources. Apply walks the dependency graph and writes the result back.</text>
    <rect x="1276" y="368" width="238" height="32" rx="16" fill="#F1F5F9"/>
    <text x="1294" y="389" class="label" font-size="11.5" fill="#475569">RECONCILIATION LOOP</text>
    <circle cx="1287" cy="384" r="4" fill="#7C3AED"/>
  </g>

  <!-- left inputs -->
  <g>
    <!-- desired -->
    <g filter="url(#softShadow)">
      <rect x="90" y="450" width="310" height="105" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
      <rect x="90" y="450" width="7" height="105" rx="3.5" fill="#7C3AED"/>
      <text x="116" y="480" class="label" font-size="12.5" fill="#6D28D9">DESIRED STATE</text>
      <text x="116" y="506" class="body" font-size="14">Your .tf configuration</text>
      <text x="116" y="531" class="mono" font-size="13" fill="#6D28D9">main.tf</text>
    </g>
    <!-- recorded -->
    <g filter="url(#softShadow)">
      <rect x="90" y="585" width="310" height="105" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <rect x="90" y="585" width="7" height="105" rx="3.5" fill="#2563EB"/>
      <text x="116" y="615" class="label" font-size="12.5" fill="#1D4ED8">RECORDED STATE</text>
      <text x="116" y="641" class="body" font-size="14">Terraform's memory of what exists</text>
      <text x="116" y="666" class="mono" font-size="13" fill="#1D4ED8">terraform.tfstate</text>
    </g>
    <!-- actual -->
    <g filter="url(#softShadow)">
      <rect x="90" y="720" width="310" height="105" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
      <rect x="90" y="720" width="7" height="105" rx="3.5" fill="#EA580C"/>
      <text x="116" y="750" class="label" font-size="12.5" fill="#C2410C">ACTUAL CLOUD</text>
      <text x="116" y="776" class="body" font-size="14">What really exists in AWS</text>
      <text x="116" y="801" class="mono" font-size="13" fill="#C2410C">read APIs</text>
    </g>
  </g>

  <!-- input arrows -->
  <g fill="none" stroke-width="2.2">
    <path d="M400 502 L530 585" stroke="#94A3B8" marker-end="url(#arrow)"/>
    <path d="M400 637 L530 650" stroke="#94A3B8" marker-end="url(#arrow)"/>
    <path d="M400 772 L530 722" stroke="#D97706" stroke-dasharray="7 5" marker-end="url(#arrowAmber)"/>
  </g>
  <text x="427" y="752" class="tiny" font-size="12" fill="#B45309">refresh</text>

  <!-- plan engine -->
  <g filter="url(#softShadow)">
    <rect x="530" y="565" width="330" height="180" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <rect x="718" y="578" width="120" height="26" rx="13" fill="#FEF3C7"/>
    <text x="734" y="596" class="label" font-size="10.5" fill="#B45309">READ-ONLY</text>
    <text x="556" y="608" class="title" font-size="22" fill="#92400E">Plan engine</text>
    <text x="556" y="638" class="body" font-size="13.5" fill="#78350F">1  refresh tracked resources</text>
    <text x="556" y="663" class="body" font-size="13.5" fill="#78350F">2  compare desired vs current</text>
    <text x="556" y="688" class="body" font-size="13.5" fill="#78350F">3  build ordered action graph</text>
    <text x="556" y="720" class="tiny" font-size="11.5" fill="#B45309">no changes are made to AWS</text>
  </g>

  <!-- plan to actions -->
  <path d="M860 655 L930 632" fill="none" stroke="#94A3B8" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- actions -->
  <g filter="url(#softShadow)">
    <rect x="930" y="455" width="300" height="310" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <text x="958" y="492" class="label" font-size="12.5" fill="#334155">PROPOSED ACTIONS</text>
    <line x1="958" y1="505" x2="1202" y2="505" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- create -->
    <rect x="956" y="523" width="38" height="28" rx="7" fill="#DCFCE7"/>
    <text x="975" y="543" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#15803D">+</text>
    <text x="1008" y="542" class="body" font-size="14" fill="#0F172A">create</text>

    <!-- update -->
    <rect x="956" y="563" width="38" height="28" rx="7" fill="#FEF3C7"/>
    <text x="975" y="583" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#B45309">~</text>
    <text x="1008" y="582" class="body" font-size="14" fill="#0F172A">update in place</text>

    <!-- destroy -->
    <rect x="956" y="603" width="38" height="28" rx="7" fill="#FEE2E2"/>
    <text x="975" y="623" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#B91C1C">-</text>
    <text x="1008" y="622" class="body" font-size="14" fill="#0F172A">destroy</text>

    <!-- replace -->
    <rect x="956" y="643" width="38" height="28" rx="7" fill="#FFEDD5"/>
    <text x="975" y="663" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#C2410C">-/+</text>
    <text x="1008" y="662" class="body" font-size="14" fill="#0F172A">replace <tspan fill="#B45309" font-weight="700">(forces new)</tspan></text>

    <!-- read -->
    <rect x="956" y="683" width="38" height="28" rx="7" fill="#DBEAFE"/>
    <text x="975" y="703" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#1D4ED8">&lt;=</text>
    <text x="1008" y="702" class="body" font-size="14" fill="#0F172A">read data source</text>

    <line x1="958" y1="726" x2="1202" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="958" y="746" class="tiny" font-size="11.5" fill="#64748B">(known after apply) = value created later</text>
  </g>

  <!-- actions to apply -->
  <path d="M1230 632 L1280 648" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrowGreen)"/>

  <!-- apply -->
  <g filter="url(#softShadow)">
    <rect x="1280" y="565" width="220" height="170" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="1400" y="578" width="82" height="26" rx="13" fill="#D1FAE5"/>
    <text x="1416" y="596" class="label" font-size="10.5" fill="#047857">WRITES</text>
    <text x="1308" y="612" class="title" font-size="22" fill="#065F46">Apply</text>
    <text x="1308" y="643" class="body" font-size="13" fill="#065F46">walk graph in order</text>
    <text x="1308" y="665" class="body" font-size="13" fill="#065F46">call provider APIs</text>
    <text x="1308" y="687" class="body" font-size="13" fill="#065F46">update state</text>
    <text x="1308" y="716" class="tiny" font-size="11" fill="#047857">not atomic · partial apply possible</text>
  </g>

  <!-- apply to updated -->
  <path d="M1390 735 L1390 850" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrowGreen)"/>

  <!-- updated -->
  <g filter="url(#softShadow)">
    <rect x="1120" y="850" width="380" height="110" rx="16" fill="url(#updatedGrad)" stroke="#FDBA74" stroke-width="1.8"/>
    <circle cx="1150" cy="884" r="6" fill="#EA580C"/>
    <circle cx="1168" cy="884" r="6" fill="#2563EB"/>
    <text x="1186" y="890" class="title" font-size="18" fill="#0F172A">AWS + state updated</text>
    <text x="1150" y="918" class="body" font-size="13.5">Real resources created, changed or deleted.</text>
    <text x="1150" y="940" class="body" font-size="13.5">IDs, attributes and outputs recorded in state.</text>
  </g>

  <!-- feedback loop -->
  <path d="M1120 905 L70 905 L70 637 L90 637" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <rect x="404" y="882" width="286" height="28" rx="14" fill="#FFFFFF"/>
  <text x="420" y="901" class="tiny" font-size="12.5" fill="#1D4ED8">next plan reads the updated state</text>

  <!-- takeaway -->
  <line x1="90" y1="1008" x2="1510" y2="1008" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="90" y="1042" class="body" font-size="14.5">The loop: configuration says <tspan font-weight="700" fill="#6D28D9">what you want</tspan>, state says <tspan font-weight="700" fill="#1D4ED8">what Terraform remembers</tspan>, cloud says <tspan font-weight="700" fill="#C2410C">what actually exists</tspan>.</text>
  <text x="90" y="1068" class="body" font-size="14.5">No state = Terraform thinks nothing exists. State is not a backup — it is the identity map between your code and real resources.</text>

  <!-- legend -->
  <g>
    <line x1="1218" y1="1036" x2="1258" y2="1036" stroke="#94A3B8" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1268" y="1041" class="tiny" font-size="11.5" fill="#64748B">flow</text>
    <line x1="1322" y1="1036" x2="1362" y2="1036" stroke="#2563EB" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
    <text x="1372" y="1041" class="tiny" font-size="11.5" fill="#64748B">read / next run</text>
  </g>
</svg>
